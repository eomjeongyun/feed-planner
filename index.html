<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff8fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FEED"><title>FEED</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=4"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=4"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head><body>
<main class="shell"><header class="top"><button id="homeBtn" class="home-btn" hidden aria-label="처음으로">‹</button><div class="logo"><svg viewBox="0 0 64 64"><use href="#scissors"/></svg><h1>FEED</h1></div><button id="clearBtn" class="clear-btn" hidden>전체 지우기</button></header>
<section id="landing" class="landing"><div class="hello"><span>PLAN YOUR CONTENT</span><h2>올리기 전에,<br>먼저 펼쳐보세요.</h2><p>블로그, 인스타그램, 유튜브 콘텐츠를<br>한눈에 미리 구성하는 나만의 피드 노트.</p></div><div class="platforms"><button data-open="blog" class="platform blog"><b>B</b><span><strong>Blog</strong><small>카드형 피드 미리보기</small></span><i>→</i></button><button data-open="instagram" class="platform instagram"><b>◎</b><span><strong>Instagram</strong><small>3열 그리드 미리보기</small></span><i>→</i></button><button data-open="youtube" class="platform youtube"><b>▶</b><span><strong>YouTube</strong><small>제목과 촬영 메모 구성</small></span><i>→</i></button></div></section>
<section id="workspace" class="workspace" hidden><div class="workspace-head"><span id="platformLabel"></span><h2 id="workspaceTitle"></h2><p id="workspaceDesc"></p></div><div id="feedGrid" class="feed-grid"></div><button id="addBtn" class="fab" aria-label="게시물 추가">＋</button></section>
</main>
<div id="editor" class="backdrop" hidden><section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div class="sheet-head"><h2 id="editorTitle">게시물 추가</h2><button id="closeEditor">닫기</button></div><label id="imageField" class="image-field"><input id="imageInput" type="file" accept="image/*" hidden><div id="imagePreview"><span>＋</span><p>사진 선택</p></div></label><label class="field">제목<input id="titleInput" maxlength="100" placeholder="게시물 제목"></label><label class="field" id="memoField">메모<textarea id="memoInput" rows="4" maxlength="500" placeholder="내용이나 촬영 아이디어를 적어두세요"></textarea></label><div class="sheet-actions"><button id="deleteBtn" class="delete" hidden>삭제</button><button id="saveBtn" class="save">저장</button></div></section></div>
<svg width="0" height="0" class="defs"><defs><symbol id="scissors" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="46" r="9"/><circle cx="47" cy="46" r="9"/><path d="m24 40 25-27M40 40 15 13M29 31l6 6"/></g></symbol></defs></svg><script src="./app.js" defer></script></body></html>
